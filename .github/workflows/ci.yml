name: Build and PostgreSQL tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: billing
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: billing_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U billing -d billing_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      BILLING_TEST_CONNECTION: Host=127.0.0.1;Port=5432;Database=billing_test;Username=billing;Password=ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --logger trx --results-directory artifacts/test-results
      - run: docker build -t billing-control:ci .
      - name: Verify production Compose over HTTPS
        env:
          POSTGRES_PASSWORD: ci-compose-only-password
          ADMIN_EMAIL: ci@example.com
          ADMIN_PASSWORD: CI-Compose-Password!123
          APP_HOST: localhost
          SMOKE_BASE_URL: https://localhost
          SMOKE_CA_CERT: deploy/tls/fullchain.pem
        run: |
          mkdir -p deploy/tls
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -keyout deploy/tls/privkey.pem -out deploy/tls/fullchain.pem -subj /CN=localhost -addext subjectAltName=DNS:localhost
          docker compose config --quiet
          docker compose up -d --build
          curl --cacert deploy/tls/fullchain.pem --fail --retry 20 --retry-delay 3 --retry-all-errors --retry-max-time 90 https://localhost/Account/Login -o /dev/null
          python3 scripts/smoke_https.py
      - name: Stop production smoke stack
        if: always()
        env:
          POSTGRES_PASSWORD: ci-compose-only-password
          ADMIN_EMAIL: ci@example.com
          ADMIN_PASSWORD: CI-Compose-Password!123
          APP_HOST: localhost
        run: |
          docker compose logs --no-color --tail 100 app nginx
          docker compose down
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/test-results
