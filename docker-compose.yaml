name: billing-control

services:
  source:
    image: alpine@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    restart: "no"
    command:
      - sh
      - -c
      - >-
        apk add --no-cache git &&
        rm -rf /release/source/repo &&
        mkdir -p /release/source/repo &&
        git -C /release/source/repo init -q &&
        git -C /release/source/repo remote add origin
        https://github.com/ChunMeng0127/BILLING_MANAGEMENT.git &&
        git -C /release/source/repo fetch --depth 1 origin
        ${RELEASE_SHA:?Set RELEASE_SHA} &&
        git -C /release/source/repo checkout --detach FETCH_HEAD &&
        test "$$(git -C /release/source/repo rev-parse HEAD)"
        = "${RELEASE_SHA:?Set RELEASE_SHA}" &&
        printf '%s\n' "${RELEASE_SHA:?Set RELEASE_SHA}"
        > /release/source/RELEASE_SHA &&
        git -C /release/source/repo show -s --format=%ct HEAD
        > /release/source/SOURCE_DATE_EPOCH
    volumes:
      - ${RELEASE_ROOT:-/docker/billing-control/releases}/${RELEASE_SHA:?Set RELEASE_SHA}:/release

  builder:
    image: mcr.microsoft.com/dotnet/sdk@sha256:4ea6fe75dd36706bb6d8c3c293d4c4315840f5d76ea28ac97def77e3ec487fa5
    restart: "no"
    command:
      - sh
      - -c
      - >-
        rm -rf /work /release/publish &&
        mkdir -p /release/publish &&
        cp -R /release/source/repo/src/BillingControl /work &&
        dotnet restore /work/BillingControl.csproj &&
        dotnet publish /work/BillingControl.csproj -c Release --no-restore
        -o /release/publish /p:UseAppHost=false &&
        sed -E -i "s/[A-Z][a-z][a-z], [0-9][0-9] [A-Z][a-z][a-z] [0-9][0-9][0-9][0-9] [0-9][0-9]:[0-9][0-9]:[0-9][0-9] GMT/$(date -u -d "@$(cat /release/source/SOURCE_DATE_EPOCH)" '+%a, %d %b %Y %H:%M:%S GMT')/g"
        /release/publish/BillingControl.staticwebassets.endpoints.json
    volumes:
      - ${RELEASE_ROOT:-/docker/billing-control/releases}/${RELEASE_SHA:?Set RELEASE_SHA}:/release
    depends_on:
      source:
        condition: service_completed_successfully

  db:
    image: postgres@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
    restart: unless-stopped
    environment:
      POSTGRES_DB: billing
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing -d billing"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - database

  keys-init:
    image: mcr.microsoft.com/dotnet/aspnet@sha256:1fe86375600b62e6566b465da9553eef0621f13c67f40fe764cd8dbb1dee1497
    restart: "no"
    user: "0"
    command: ["sh", "-c", "mkdir -p /keys && chown -R 1654:1654 /keys"]
    volumes:
      - data_keys:/keys

  migrate:
    image: mcr.microsoft.com/dotnet/aspnet@sha256:1fe86375600b62e6566b465da9553eef0621f13c67f40fe764cd8dbb1dee1497
    restart: "no"
    command: ["dotnet", "/app/BillingControl.dll", "--migrate"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=db;Database=billing;Username=billing_migrator;Password=${MIGRATOR_DB_PASSWORD:?Set MIGRATOR_DB_PASSWORD}
      BootstrapAdmin__Email: ${ADMIN_EMAIL:?Set ADMIN_EMAIL}
      BootstrapAdmin__Password: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      Seed__Demo: "false"
      DataProtection__Path: /keys
      Release__Sha: ${RELEASE_SHA:?Set RELEASE_SHA}
    volumes:
      - ${RELEASE_ROOT:-/docker/billing-control/releases}/${RELEASE_SHA:?Set RELEASE_SHA}/publish:/app:ro
      - data_keys:/keys
    depends_on:
      db:
        condition: service_healthy
      keys-init:
        condition: service_completed_successfully
    networks:
      - database

  app:
    image: mcr.microsoft.com/dotnet/aspnet@sha256:1fe86375600b62e6566b465da9553eef0621f13c67f40fe764cd8dbb1dee1497
    restart: unless-stopped
    command: ["dotnet", "/app/BillingControl.dll"]
    working_dir: /app
    environment:
      TZ: Asia/Kuala_Lumpur
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_HTTPS_PORT: "443"
      ConnectionStrings__Default: Host=db;Database=billing;Username=billing_runtime;Password=${RUNTIME_DB_PASSWORD:?Set RUNTIME_DB_PASSWORD}
      DataProtection__Path: /keys
      ReverseProxy__Address: 172.17.0.1
      ReverseProxy__Network: 172.16.0.0/12
      AllowedHosts: ${APP_HOST:?Set APP_HOST}
      Release__Sha: ${RELEASE_SHA:?Set RELEASE_SHA}
    volumes:
      - ${RELEASE_ROOT:-/docker/billing-control/releases}/${RELEASE_SHA:?Set RELEASE_SHA}/publish:/app:ro
      - data_keys:/keys
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'request() {
          exec 3<>/dev/tcp/127.0.0.1/8080;
          host="$${AllowedHosts%%;*}";
          printf "GET $$1 HTTP/1.0\r\nHost: %s\r\nConnection: close\r\n\r\n" "$$host" >&3;
          IFS= read -r line <&3;
          exec 3<&-; exec 3>&-;
          printf "%s" "$$line";
          };
          status="$$(request /health/ready)";
          [[ "$$status" == *" 200 "* ]] && exit 0;
          [[ "$$status" == *" 404 "* || "$$status" == *" 307 "* ]] || exit 1;
          legacy="$$(request /Account/Login)";
          [[ "$$legacy" == *" 200 "* || "$$legacy" == *" 307 "* ]]'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - database
      - frontend
    labels:
      - traefik.enable=true
      - traefik.docker.network=billing-control_frontend
      - traefik.http.routers.billing-control.rule=Host(`${APP_HOST:?Set APP_HOST}`)
      - traefik.http.routers.billing-control.entrypoints=websecure
      - traefik.http.routers.billing-control.tls=true
      - traefik.http.routers.billing-control.tls.certresolver=letsencrypt
      - traefik.http.services.billing-control.loadbalancer.server.port=8080
      - com.billing-control.release-sha=${RELEASE_SHA:?Set RELEASE_SHA}

volumes:
  postgres_data:
  data_keys:

networks:
  database:
    internal: true
  frontend:
    name: billing-control_frontend
