# Installed on the production VPS as /etc/ssh/sshd_config.d/00-a5-hardening.conf.
# Apply only after a non-root key-only administrator has been independently verified.
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PermitEmptyPasswords no
X11Forwarding no
MaxAuthTries 3
