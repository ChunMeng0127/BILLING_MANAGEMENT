name: billing-control
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: billing
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing -d billing"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - database

  migrate:
    build: .
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    command: ["--migrate"]
    environment:
      ConnectionStrings__Default: Host=db;Database=billing;Username=billing;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      BootstrapAdmin__Email: ${ADMIN_EMAIL:?Set ADMIN_EMAIL}
      BootstrapAdmin__Password: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      Seed__Demo: "false"
      DataProtection__Path: /keys
    volumes:
      - data_keys:/keys
    depends_on:
      db:
        condition: service_healthy
    networks:
      - database

  app:
    build: .
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    environment:
      TZ: Asia/Kuala_Lumpur
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_HTTPS_PORT: "443"
      ConnectionStrings__Default: Host=db;Database=billing;Username=billing;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      DataProtection__Path: /keys
      ReverseProxy__Network: 172.30.88.0/24
      AllowedHosts: ${APP_HOST:?Set APP_HOST}
    volumes:
      - data_keys:/keys
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080;
          printf "GET /health/ready HTTP/1.0\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          IFS= read -r status <&3;
          [[ "$$status" == *" 200 "* ]]'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - database
      - frontend
    labels:
      - traefik.enable=true
      - traefik.docker.network=billing-control_frontend
      - traefik.http.routers.billing-control.rule=Host(`${APP_HOST:?Set APP_HOST}`)
      - traefik.http.routers.billing-control.entrypoints=websecure
      - traefik.http.routers.billing-control.tls=true
      - traefik.http.services.billing-control.loadbalancer.server.port=8080

  traefik:
    image: traefik@sha256:9c3b91d5fb7770853ca5c1124a23c34bf2d9b47ffaebeab2614cbaf410dcb2ac
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.file.filename=/etc/traefik/dynamic.yaml
      - --entrypoints.websecure.address=:443
      - --ping=true
    ports:
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./deploy/traefik-ci.yaml:/etc/traefik/dynamic.yaml:ro
      - ./deploy/tls:/etc/traefik/tls:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - frontend

volumes:
  postgres_data:
  data_keys:

networks:
  database:
    internal: true
  frontend:
    name: billing-control_frontend
    ipam:
      config:
        - subnet: 172.30.88.0/24
