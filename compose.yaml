name: billing-control
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: billing
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing -d billing"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - database
  migrate:
    build: .
    command: ["--migrate"]
    environment:
      ConnectionStrings__Default: Host=db;Database=billing;Username=billing;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      BootstrapAdmin__Email: ${ADMIN_EMAIL:?Set ADMIN_EMAIL}
      BootstrapAdmin__Password: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      Seed__Demo: "false"
      DataProtection__Path: /keys
    volumes:
      - data_keys:/keys
    depends_on:
      db:
        condition: service_healthy
    networks:
      - database
  app:
    build: .
    restart: unless-stopped
    environment:
      TZ: Asia/Kuala_Lumpur
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_HTTPS_PORT: "443"
      ConnectionStrings__Default: Host=db;Database=billing;Username=billing;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      DataProtection__Path: /keys
      ReverseProxy__Address: 172.30.88.10
      AllowedHosts: ${APP_HOST:?Set APP_HOST}
    volumes:
      - data_keys:/keys
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - database
      - frontend
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/tls:/etc/nginx/tls:ro
    depends_on:
      - app
    networks:
      frontend:
        ipv4_address: 172.30.88.10
volumes:
  postgres_data:
  data_keys:
networks:
  database:
    internal: true
  frontend:
    ipam:
      config:
        - subnet: 172.30.88.0/24
